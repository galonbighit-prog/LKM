        const playKitchenChime = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.log("Audio not allowed yet:", e);
            }
        };

        function App() {
            // Global Mode: 'customer' or 'admin'
            const [activeRole, setActiveRole] = useState('customer');
            
            // Shared App State
            const [menuItems, setMenuItems] = useState(INITIAL_MENU);
            const [orders, setOrders] = useState(INITIAL_ORDERS);
            const [currentTable, setCurrentTable] = useState('05');
            const [cart, setCart] = useState([]);
            const [customerActiveOrder, setCustomerActiveOrder] = useState(null);

            // UI Modals
            const [selectedMenuForNote, setSelectedMenuForNote] = useState(null);
            const [customNote, setCustomNote] = useState('');
            const [customQty, setCustomQty] = useState(1);
            const [showCartDrawer, setShowCartDrawer] = useState(false);
            const [showCheckoutModal, setShowCheckoutModal] = useState(false);
            const [paymentMethod, setPaymentMethod] = useState('QRIS');
            const [isPaying, setIsPaying] = useState(false);
            const [showToast, setShowToast] = useState({ show: false, message: '', type: 'success' });

            // Admin Filters & Tabs
            const [adminTab, setAdminTab] = useState('kds'); // 'kds', 'menu', 'tables', 'analytics'
            const [categoryFilter, setCategoryFilter] = useState('Semua');
            const [searchQuery, setSearchQuery] = useState('');

            // Helper for Toast
            const triggerToast = (msg, type = 'success') => {
                setShowToast({ show: true, message: msg, type });
                setTimeout(() => setShowToast({ show: false, message: '', type: 'success' }), 3000);
            };

            const handleOpenNoteModal = (item) => {
                if (!item.isAvailable) {
                    triggerToast('Maaf, menu ini sedang habis (Sold Out)', 'error');
                    return;
                }
                setSelectedMenuForNote(item);
                setCustomNote('');
                setCustomQty(1);
            };

            const handleAddToCart = () => {
                if (!selectedMenuForNote) return;
                const existingIndex = cart.findIndex(
                    c => c.item.id === selectedMenuForNote.id && c.note === customNote
                );

                if (existingIndex > -1) {
                    const newCart = [...cart];
                    newCart[existingIndex].qty += customQty;
                    setCart(newCart);
                } else {
                    setCart([...cart, { item: selectedMenuForNote, qty: customQty, note: customNote }]);
                }

                triggerToast(`${selectedMenuForNote.name} ditambahkan ke keranjang!`);
                setSelectedMenuForNote(null);
            };

            const handleUpdateCartQty = (index, delta) => {
                const newCart = [...cart];
                newCart[index].qty += delta;
                if (newCart[index].qty <= 0) {
                    newCart.splice(index, 1);
                }
                setCart(newCart);
            };

            const cartTotal = useMemo(() => {
                return cart.reduce((acc, curr) => acc + (curr.item.price * curr.qty), 0);
            }, [cart]);

            const handleProcessPayment = () => {
                if (cart.length === 0) return;
                setIsPaying(true);

                setTimeout(() => {
                    const newOrderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
                    const now = new Date();
                    const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} WIB`;

                    const newOrder = {
                        id: newOrderId,
                        tableNo: currentTable,
                        customerName: `Pelanggan Meja ${currentTable}`,
                        items: cart.map(c => ({
                            name: c.item.name,
                            qty: c.qty,
                            price: c.item.price,
                            note: c.note
                        })),
                        total: cartTotal,
                        paymentMethod: paymentMethod,
                        paymentStatus: 'Lunas',
                        orderStatus: 'Baru',
                        time: timeStr
                    };

                    setOrders(prev => [newOrder, ...prev]);
                    setCustomerActiveOrder(newOrder);
                    setCart([]);
                    setIsPaying(false);
                    setShowCheckoutModal(false);
                    setShowCartDrawer(false);
                    playKitchenChime();
                    triggerToast('Pembayaran Berhasil! Pesanan Anda dikirim ke dapur.');
                }, 2000);
            };

            const handleUpdateOrderStatus = (orderId, newStatus) => {
                setOrders(prev => prev.map(ord => {
                    if (ord.id === orderId) {
                        return { ...ord, orderStatus: newStatus };
                    }
                    return ord;
                }));

                // Update active customer order if it matches
                if (customerActiveOrder && customerActiveOrder.id === orderId) {
                    setCustomerActiveOrder(prev => ({ ...prev, orderStatus: newStatus }));
                }

                triggerToast(`Status Pesanan #${orderId} diubah ke "${newStatus}"`);
            };

            const handleToggleMenuAvailability = (id) => {
                setMenuItems(prev => prev.map(m => {
                    if (m.id === id) {
                        const updated = !m.isAvailable;
                        triggerToast(`${m.name} sekarang ${updated ? 'TERSEDIA' : 'HABIS (Sold Out)'}`);
                        return { ...m, isAvailable: updated };
                    }
                    return m;
                }));

                            </div>

                                    onClick={() => setActiveRole('customer')}

                        </div>

                            </div>

                    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">

                            <CustomerView

                                currentTable={currentTable}

                                setCustomerActiveOrder={setCustomerActiveOrder}

                                setSearchQuery={setSearchQuery}
                            />

                            <AdminView
                                orders={orders}
                                menuItems={menuItems}
                                onUpdateOrderStatus={handleUpdateOrderStatus}
                                onToggleAvailability={handleToggleMenuAvailability}
                                adminTab={adminTab}
                                setAdminTab={setAdminTab}
                                setMenuItems={setMenuItems}
                                triggerToast={triggerToast}
                            />
                        )}
                    </main>

                    {}
                    {selectedMenuForNote && (
                        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in">
                            <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl space-y-4">
                                <div class="flex justify-between items-start">
                                    <div class="flex gap-3">
                                        <img src={selectedMenuForNote.image} class="w-16 h-16 rounded-xl object-cover" alt="" />
                                        <div>
                                            <h3 class="font-bold text-slate-800 text-base">{selectedMenuForNote.name}</h3>
                                            <p class="text-orange-600 font-bold text-sm">Rp {selectedMenuForNote.price.toLocaleString('id-ID')}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setSelectedMenuForNote(null)} class="text-slate-400 hover:text-slate-600">
                                        <i class="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                <div class="space-y-2">
                                    <label class="block text-xs font-semibold text-slate-600">
                                        <i class="fa-regular fa-comment-dots text-orange-500 mr-1"></i>
                                        Catatan Khusus Pesanan (Opsional)
                                    </label>
                                    <textarea
                                        value={customNote}
                                        onChange={(e) => setCustomNote(e.target.value)}

                                        class="w-full text-sm p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 h-20 resize-none bg-slate-50"
                                    ></textarea>
                                </div>

                                <div class="flex items-center justify-between pt-2">
                                    <span class="text-sm font-semibold text-slate-700">Jumlah Porsi</span>
                                    <div class="flex items-center gap-3 bg-slate-100 p-1.5 rounded-xl">
                                        <button
                                            onClick={() => setCustomQty(Math.max(1, customQty - 1))}
                                            class="w-8 h-8 rounded-lg bg-white shadow flex items-center justify-center font-bold text-slate-700 hover:bg-slate-200"
                                        >
                                            <i class="fa-solid fa-minus text-xs"></i>
                                        </button>
                                        <span class="font-bold text-slate-800 w-6 text-center">{customQty}</span>
                                        <button
                                            onClick={() => setCustomQty(customQty + 1)}

                            </div>
                        </div>
                    )}

                    {}
                    {showCartDrawer && (
                        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end justify-center">
                            <div class="bg-white w-full max-w-2xl rounded-t-3xl p-6 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
                                <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                                    <div class="flex items-center gap-2">
                                        <i class="fa-solid fa-basket-shopping text-orange-500 text-lg"></i>
                                        <h3 class="font-bold text-slate-800 text-lg">Keranjang Belanja (Meja {currentTable})</h3>
                                    </div>
                                    <button onClick={() => setShowCartDrawer(false)} class="text-slate-400 hover:text-slate-600">
                                        <i class="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                <div class="overflow-y-auto flex-1 divide-y divide-slate-100 pr-1">
                                    {cart.length === 0 ? (
                                        <div class="text-center py-12 text-slate-400 space-y-2">
                                            <i class="fa-solid fa-utensils text-4xl mb-2 text-slate-300"></i>
                                            <p>Keranjang Anda masih kosong.</p>
                                        </div>
                                    ) : (
                                        cart.map((c, idx) => (
                                            <div key={idx} class="py-3 flex items-center justify-between gap-3">
                                                <div class="flex-1">
                                                    <h4 class="font-semibold text-slate-800 text-sm">{c.item.name}</h4>
                                                    <p class="text-orange-600 font-bold text-xs">Rp {c.item.price.toLocaleString('id-ID')}</p>
                                                    {c.note && (
                                                        <p class="text-[11px] text-slate-500 italic mt-0.5">
                                                            <i class="fa-solid fa-pen-clip text-[10px] mr-1"></i>
                                                            "{c.note}"
                                                        </p>
                                                    )}
                                                </div>
                                                <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-lg">
                                                    <button
                                                        onClick={() => handleUpdateCartQty(idx, -1)}
                                                        class="w-7 h-7 rounded bg-white text-slate-700 shadow flex items-center justify-center font-bold text-xs"
                                                    >
                                                        <i class="fa-solid fa-minus text-[10px]"></i>
                                                    </button>
                                                    <span class="font-bold text-xs text-slate-800 w-5 text-center">{c.qty}</span>
                                                    <button
                                                        onClick={() => handleUpdateCartQty(idx, 1)}
                                                        class="w-7 h-7 rounded bg-orange-500 text-white shadow flex items-center justify-center font-bold text-xs"
                                                    >
                                                        <i class="fa-solid fa-plus text-[10px]"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {cart.length > 0 && (
                                    <div class="pt-3 border-t border-slate-100 space-y-3">
                                        <div class="flex justify-between items-center text-sm">
                                            <span class="text-slate-500 font-medium">Subtotal Pesanan</span>
                                            <span class="font-bold text-slate-800 text-base">Rp {cartTotal.toLocaleString('id-ID')}</span>
                                        </div>
                                        <button
                                            onClick={() => setShowCheckoutModal(true)}
                                            class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-orange-500/30 flex items-center justify-center gap-2 transition-all active:scale-95"
                                        >
                                            <i class="fa-solid fa-credit-card"></i>
                                            Lanjut ke Pembayaran Instant
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {}
                    {showCheckoutModal && (
                        <div class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-md flex items-center justify-center p-4">
                            <div class="bg-white w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <div>
                                        <h3 class="font-bold text-slate-800 text-lg">Pembayaran Nontunai Instan</h3>
                                        <p class="text-xs text-slate-500">Nomor Meja: <span class="font-bold text-orange-600">Meja {currentTable}</span></p>
                                    </div>
                                    <button onClick={() => setShowCheckoutModal(false)} class="text-slate-400 hover:text-slate-600">
                                        <i class="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                {/* Choose Payment Method */}
                                <div class="space-y-2">
                                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block">Pilih Metode Pembayaran</label>
                                    <div class="grid grid-cols-3 gap-2">
                                        <button
                                            onClick={() => setPaymentMethod('QRIS')}
                                            class={`p-3 rounded-xl border-2 flex flex-col items-center gap-1 transition-all ${
                                                paymentMethod === 'QRIS' ? 'border-red-500 bg-red-50 text-red-600 font-bold' : 'border-slate-200 text-slate-600'
                                            }`}
                                        >
                                            <i class="fa-solid fa-qrcode text-xl"></i>
                                            <span class="text-xs">QRIS</span>
                                        </button>
                                        <button
                                            onClick={() => setPaymentMethod('ShopeePay')}
                                            class={`p-3 rounded-xl border-2 flex flex-col items-center gap-1 transition-all ${
                                                paymentMethod === 'ShopeePay' ? 'border-orange-500 bg-orange-50 text-orange-600 font-bold' : 'border-slate-200 text-slate-600'
                                            }`}
                                        >
                                            <i class="fa-solid fa-wallet text-xl"></i>
                                            <span class="text-xs">ShopeePay</span>
                                        </button>
                                        <button
                                            onClick={() => setPaymentMethod('DANA')}
                                            class={`p-3 rounded-xl border-2 flex flex-col items-center gap-1 transition-all ${
                                                paymentMethod === 'DANA' ? 'border-blue-500 bg-blue-50 text-blue-600 font-bold' : 'border-slate-200 text-slate-600'
                                            }`}
                                        >
                                            <i class="fa-solid fa-mobile-retro text-xl"></i>
                                            <span class="text-xs">DANA</span>
                                        </button>
                                    </div>
                                </div>

                                {/* QR Preview Simulation Area */}
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center space-y-3">
                                    <div class="flex items-center justify-center gap-2">
                                        <span class="text-xs text-slate-500 font-medium">Scan QR untuk bayar via</span>
                                        <span class="font-extrabold text-sm text-slate-800 uppercase">{paymentMethod}</span>
                                    </div>
                                    
                                    {/* Simulated QR Code SVG */}
                                    <div class="w-48 h-48 bg-white mx-auto p-3 rounded-xl shadow-inner border flex flex-col items-center justify-center relative">
                                        {isPaying ? (
                                            <div class="flex flex-col items-center gap-2 text-orange-500">
                                                <i class="fa-solid fa-spinner fa-spin text-3xl"></i>
                                                <span class="text-xs font-semibold text-slate-600">Memproses Pembayaran...</span>
                                            </div>
                                        ) : (
                                            <>
                                                <svg class="w-full h-full text-slate-800" viewBox="0 0 24 24" fill="currentColor">
                                                    <path d="M2 2h8v8H2V2zm2 2v4h4V4H4zm11-2h7v8h-7V2zm2 2v4h3V4h-3zM2 14h8v8H2v-8zm2 2v4h4v-4H4zm14 3h3v3h-3v-3zm-3-3h3v3h-3v-3zm3-3h3v3h-3v-3zm-3 6h3v3h-3v-3zm-3-3h3v3h-3v-3z"/>
                                                </svg>
                                                <div class="absolute inset-0 flex items-center justify-center">
                                                    <span class="bg-white px-2 py-0.5 rounded text-[10px] font-black tracking-widest text-orange-600 shadow border border-orange-200">
                                                        {paymentMethod}
                                                    </span>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                    <p class="text-[11px] text-slate-400">Total Tagihan: <span class="font-bold text-slate-800 text-sm">Rp {cartTotal.toLocaleString('id-ID')}</span></p>
                                </div>

                                <button
                                    onClick={handleProcessPayment}
                                    disabled={isPaying}
                                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 transition-all active:scale-95 disabled:opacity-50"
                                >
                                    <i class="fa-solid fa-check-double"></i>
                                    {isPaying ? 'Sedang Memverifikasi...' : 'Simulasi Bayar Sekarang'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function CustomerView({
            menuItems,
            currentTable,
            setCurrentTable,
            cart,
            onOpenNoteModal,
            setShowCartDrawer,
            customerActiveOrder,
            setCustomerActiveOrder,
            categoryFilter,
            setCategoryFilter,
            searchQuery,
            setSearchQuery
        }) {
            const categories = ['Semua', 'Sarapan', 'Minuman', 'Dessert', 'Warteg'];

            const filteredMenu = menuItems.filter(item => {
                const matchCategory = categoryFilter === 'Semua' || item.category === categoryFilter;
                const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    item.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            const cartCount = cart.reduce((acc, c) => acc + c.qty, 0);

            return (
                <div class="space-y-6 max-w-4xl mx-auto">
                    {/* Header Banner & Table Selector */}
                    <div class="bg-gradient-to-r from-orange-600 to-amber-500 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                        <div class="relative z-10 space-y-3">
                            <div class="flex items-center justify-between">
                                <div class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5">
                                    <i class="fa-solid fa-qrcode"></i>
                                    Terhubung via Scan QR
                                </div>
                                {/* Change Table Simulation */}
                                <div class="flex items-center gap-2 bg-slate-900/40 backdrop-blur-md px-3 py-1 rounded-xl text-xs">
                                    <i class="fa-solid fa-chair text-amber-300"></i>
                                    <span>Nomor Meja:</span>
                                    <select
                                        value={currentTable}
                                        onChange={(e) => setCurrentTable(e.target.value)}
                                        class="bg-transparent font-bold text-amber-300 focus:outline-none cursor-pointer"
                                    >
                                        {['01', '02', '03', '04', '05', '06', '07', '08', '09', '10'].map(num => (
                                            <option key={num} value={num} class="text-slate-800">Meja {num}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <h2 class="text-2xl font-extrabold tracking-tight">Selamat Datang di Restoran!</h2>
                                <p class="text-xs text-orange-100 mt-1">Pilih menu favorit Anda, pesan langsung tanpa antre, dan bayar secara instan.</p>
                            </div>
                        </div>
                    </div>

                    {/* Active Order Status Tracker Widget */}
                    {customerActiveOrder && (
                        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
                            <div class="flex justify-between items-center border-b pb-2">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-clock-rotate-left text-orange-500"></i>
                                    <span class="font-bold text-sm text-slate-800">Status Pesanan #{customerActiveOrder.id}</span>
                                </div>
                                <span class="text-xs text-slate-400">{customerActiveOrder.time}</span>
                            </div>

                            {/* Status Timeline Bar */}
                            <div class="grid grid-cols-4 gap-2 text-center text-[10px] font-bold">
                                <div class={`p-2 rounded-xl border ${customerActiveOrder.orderStatus === 'Baru' ? 'bg-orange-50 border-orange-500 text-orange-600' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                    1. Pesanan Masuk
                                </div>
                                <div class={`p-2 rounded-xl border ${customerActiveOrder.orderStatus === 'Dimasak' ? 'bg-amber-50 border-amber-500 text-amber-600' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                    2. Dimasak Dapur
                                </div>
                                <div class={`p-2 rounded-xl border ${customerActiveOrder.orderStatus === 'Siap' ? 'bg-blue-50 border-blue-500 text-blue-600' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                    3. Siap Diantar
                                </div>
                                <div class={`p-2 rounded-xl border ${customerActiveOrder.orderStatus === 'Selesai' ? 'bg-emerald-50 border-emerald-500 text-emerald-600' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                    4. Selesai
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Search & Categories Bar */}
                    <div class="space-y-3">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                            <input
                                type="text"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="Cari makanan, minuman, atau dessert..."
                                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 shadow-sm"
                            />
                        </div>

                        {/* Category Pills */}
                        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setCategoryFilter(cat)}
                                    class={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                                        categoryFilter === cat
                                            ? 'bg-orange-500 text-white shadow-md shadow-orange-500/20'
                                            : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    {}
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {filteredMenu.map(item => (
                            <div
                                key={item.id}
                                class={`bg-white rounded-2xl p-3 border border-slate-200 shadow-sm hover:shadow-md transition-all flex gap-3 relative ${
                                    !item.isAvailable ? 'opacity-60 bg-slate-50' : ''
                                }`}
                            >
                                <img
                                    src={item.image}
                                    alt={item.name}
                                    class="w-24 h-24 sm:w-28 sm:h-28 rounded-xl object-cover"
                                />
                                <div class="flex-1 flex flex-col justify-between">
                                    <div>
                                        <div class="flex items-center justify-between gap-1">
                                            <h3 class="font-bold text-slate-800 text-sm line-clamp-1">{item.name}</h3>
                                            {item.badge && (
                                                <span class="bg-orange-100 text-orange-700 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md whitespace-nowrap">
                                                    {item.badge}
                                                </span>
                                            )}
                                        </div>
                                        <p class="text-slate-500 text-xs line-clamp-2 mt-1 leading-relaxed">{item.description}</p>
                                    </div>

                                    <div class="flex items-center justify-between mt-2">
                                        <span class="font-extrabold text-orange-600 text-sm">
                                            Rp {item.price.toLocaleString('id-ID')}
                                        </span>

                                        {item.isAvailable ? (
                                            <button
                                                onClick={() => onOpenNoteModal(item)}
                                                class="bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow flex items-center gap-1 active:scale-95 transition-all"
                                            >
                                                <i class="fa-solid fa-plus text-[10px]"></i>
                                                Pesan
                                            </button>
                                        ) : (
                                            <span class="bg-slate-200 text-slate-500 text-[11px] font-bold px-2 py-1 rounded">
                                                Habis
                                            </span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Floating Cart Button */}
                    {cartCount > 0 && (
                        <div class="fixed bottom-6 left-0 right-0 z-30 px-4 max-w-md mx-auto">
                            <button
                                onClick={() => setShowCartDrawer(true)}
                                class="w-full bg-slate-900 hover:bg-black text-white p-4 rounded-2xl shadow-2xl flex items-center justify-between animate-bounce"
                            >
                                <div class="flex items-center gap-3">
                                    <div class="bg-orange-500 text-white font-extrabold text-xs px-2.5 py-1 rounded-lg">
                                        {cartCount} item
                                    </div>
                                    <span class="font-bold text-sm">Lihat Keranjang Belanja</span>
                                </div>
                                <i class="fa-solid fa-arrow-right text-orange-400"></i>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function AdminView({
            orders,
            menuItems,
            onUpdateOrderStatus,
            onToggleAvailability,
            adminTab,
            setAdminTab,
            setMenuItems,
            triggerToast
        }) {
            const [newMenuName, setNewMenuName] = useState('');
            const [newMenuPrice, setNewMenuPrice] = useState('');
            const [newMenuCat, setNewMenuCat] = useState('Makanan');

            const handleAddMenu = (e) => {
                e.preventDefault();
                if (!newMenuName || !newMenuPrice) return;

                const newItem = {
                    id: 'm' + (menuItems.length + 1),
                    name: newMenuName,
                    category: newMenuCat,
                    price: parseInt(newMenuPrice),
                    rating: 5.0,
                    image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80',
                    description: 'Menu baru yang nikmat dan disajikan hangat.',
                    badge: 'Baru',
                    isAvailable: true
                };

                setMenuItems([newItem, ...menuItems]);
                setNewMenuName('');
                setNewMenuPrice('');
                triggerToast('Menu baru berhasil ditambahkan!');
            };

            return (
                <div class="space-y-6">
                    {/* Admin Dashboard Sub-Navigation Tabs */}
                    <div class="flex gap-2 border-b border-slate-200 pb-2 overflow-x-auto">
                        <button
                            onClick={() => setAdminTab('kds')}
                            class={`px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 whitespace-nowrap transition-all ${
                                adminTab === 'kds' ? 'bg-slate-900 text-white' : 'bg-white border text-slate-600'
                            }`}
                        >
                            <i class="fa-solid fa-fire-burner"></i>
                            Kitchen Display (KDS)
                        </button>
                        <button
                            onClick={() => setAdminTab('menu')}
                            class={`px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 whitespace-nowrap transition-all ${
                                adminTab === 'menu' ? 'bg-slate-900 text-white' : 'bg-white border text-slate-600'
                            }`}
                        >
                            <i class="fa-solid fa-list-check"></i>
                            Kelola Stok Menu
                        </button>
                        <button
                            onClick={() => setAdminTab('tables')}
                            class={`px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 whitespace-nowrap transition-all ${
                                adminTab === 'tables' ? 'bg-slate-900 text-white' : 'bg-white border text-slate-600'
                            }`}
                        >
                            <i class="fa-solid fa-qrcode"></i>
                            Cetak QR Meja
                        </button>
                    </div>

                    {/* KDS View */}
                    {adminTab === 'kds' && (
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <h2 class="text-xl font-extrabold text-slate-800">Antrean Dapur Real-time</h2>
                                <span class="text-xs bg-orange-100 text-orange-700 font-bold px-2.5 py-1 rounded-full">
                                    {orders.filter(o => o.orderStatus !== 'Selesai').length} Pesanan Aktif
                                </span>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {orders.map(order => (
                                    <div
                                        key={order.id}
                                        class={`bg-white rounded-2xl border-2 p-4 shadow-sm flex flex-col justify-between space-y-3 ${
                                            order.orderStatus === 'Baru'
                                                ? 'border-red-500 bg-red-50/20'
                                                : order.orderStatus === 'Dimasak'
                                                ? 'border-amber-400'
                                                : order.orderStatus === 'Siap'
                                                ? 'border-blue-400'
                                                : 'border-slate-200'
                                        }`}
                                    >
                                        <div>
                                            <div class="flex justify-between items-start border-b pb-2">
                                                <div>
                                                    <span class="text-xs font-black text-slate-400">{order.id}</span>
                                                    <h3 class="font-black text-xl text-slate-800">Meja {order.tableNo}</h3>
                                                </div>
                                                <span class={`text-[10px] font-extrabold px-2 py-1 rounded-md uppercase tracking-wider ${
                                                    order.orderStatus === 'Baru' ? 'bg-red-500 text-white animate-pulse' :
                                                    order.orderStatus === 'Dimasak' ? 'bg-amber-500 text-white' :
                                                    order.orderStatus === 'Siap' ? 'bg-blue-500 text-white' : 'bg-emerald-500 text-white'
                                                }`}>
                                                    {order.orderStatus}
                                                </span>
                                            </div>

                                            {/* Items List */}
                                            <div class="divide-y divide-slate-100 my-3 space-y-2">
                                                {order.items.map((it, idx) => (
                                                    <div key={idx} class="pt-2 text-xs">
                                                        <div class="flex justify-between font-bold text-slate-800">
                                                            <span>{it.qty}x {it.name}</span>
                                                        </div>
                                                        {it.note && (
                                                            <p class="text-orange-600 font-semibold italic text-[11px] mt-0.5">
                                                                * Note: {it.note}
                                                            </p>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Status Action Buttons */}
                                        <div class="pt-2 border-t flex gap-2">
                                            {order.orderStatus === 'Baru' && (
                                                <button
                                                    onClick={() => onUpdateOrderStatus(order.id, 'Dimasak')}
                                                    class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 rounded-xl text-xs shadow"
                                                >
                                                    <i class="fa-solid fa-fire mr-1"></i> Mulai Masak
                                                </button>
                                            )}
                                            {order.orderStatus === 'Dimasak' && (
                                                <button
                                                    onClick={() => onUpdateOrderStatus(order.id, 'Siap')}
                                                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl text-xs shadow"
                                                >
                                                    <i class="fa-solid fa-bell mr-1"></i> Pesanan Siap
                                                </button>
                                            )}
                                            {order.orderStatus === 'Siap' && (
                                                <button
                                                    onClick={() => onUpdateOrderStatus(order.id, 'Selesai')}
                                                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs shadow"
                                                >
                                                    <i class="fa-solid fa-check mr-1"></i> Selesaikan
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Menu Management View */}
                    {adminTab === 'menu' && (
                        <div class="space-y-6">
                            {/* Add New Menu Form */}
                            <form onSubmit={handleAddMenu} class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                <h3 class="font-bold text-sm text-slate-800">Tambah Menu Baru</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <input
                                        type="text"
                                        placeholder="Nama Menu"
                                        value={newMenuName}
